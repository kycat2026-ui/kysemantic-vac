name: Probe NFT

on:
  push:
    branches: [main]
    paths:
      - tools/probe_any.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/probe_any.py | tee tools/probe_any_log.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tools/probe_any_log.txt
          git commit -m "Probe NFT" || echo "No changes"
          git pull --rebase && git push
