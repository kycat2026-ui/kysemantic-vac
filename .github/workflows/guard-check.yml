name: VAC Guard live check

on:
  push:
    branches: [main]
    paths:
      - vac_guard.py
      - example_attach.py
      - .github/workflows/guard-check.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -o pipefail
          python3 vac_guard.py | tee tools/guard_log.txt
          python3 example_attach.py | tee -a tools/guard_log.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tools/guard_log.txt
          git commit -m "VAC Guard live check" || echo "No changes"
          git pull --rebase && git push
