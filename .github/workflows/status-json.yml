name: Publish status.json from chain

on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - tools/make_status_json.py
      - .github/workflows/status-json.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/make_status_json.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f status.json
          git commit -m "Update status.json from chain" || echo "No change"
          git pull --rebase && git push
