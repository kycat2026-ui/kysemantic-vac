name: Wallet attention check (private artifact)

on:
  push:
    branches: [main]
    paths:
      - tools/attention.py
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/attention.py > attention_log.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: attention
          path: attention_log.txt
          retention-days: 1
